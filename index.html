<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Training Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --navy: #0a1628;
      --navy-mid: #112244;
      --gold: #f5c518;
      --gold-dark: #c9a00d;
      --soft-blue: #c8d8f0;
      --green: #00d084;
      --green-dark: #00a065;
      --red: #ff3e55;
      --red-dark: #cc1f38;
      --bg: #f0f4fb;
      --card: #ffffff;
      --text: #0a1628;
      --muted: #6b7a99;
      --ring: #dce8f8;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      overflow-y: auto;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
    }

    body {
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: 60px;
      background: radial-gradient(ellipse at 60% 0%, #d4e8ff 0%, var(--bg) 60%);
    }

    /* ── UTILITY BAR ── */
    .utility-bar {
      width: 100%; background: var(--navy);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; height: 48px;
    }

    .app-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem; font-weight: 900;
      color: var(--gold); letter-spacing: 2px;
      text-transform: uppercase;
    }

    #logout-btn {
      background: transparent; color: #aab8d0;
      border: 1px solid #2a3a5c; border-radius: 6px;
      padding: 5px 14px; font-size: 0.78rem; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      letter-spacing: 0.5px; transition: all 0.2s;
    }
    #logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── PROFILE STRIP ── */
    .user-profile {
      width: 100%; max-width: 420px;
      display: flex; align-items: center;
      gap: 12px; padding: 14px 18px;
    }

    .profile-icon {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--navy); color: var(--soft-blue);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 2px 8px rgba(10,22,40,0.15);
    }

    .user-meta { display: flex; flex-direction: column; flex: 1; }
    #user-name { font-weight: 900; font-size: 0.95rem; color: var(--navy); line-height: 1.2; }
    #level-badge {
      font-size: 0.72rem; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
    }

    /* XP pip bar */
    .xp-pips {
      display: flex; gap: 5px; align-items: center; flex-shrink: 0;
    }
    .pip {
      width: 14px; height: 14px; border-radius: 50%;
      background: #dce8f8; border: 2px solid #c0d0e8;
      transition: background 0.4s, border-color 0.4s, transform 0.3s;
    }
    .pip.filled {
      background: var(--green);
      border-color: var(--green-dark);
      transform: scale(1.1);
      box-shadow: 0 0 6px rgba(0,208,132,0.5);
    }

    /* ── TUTORIAL BANNER ── */
    #tutorial-banner {
      width: 100%; max-width: 400px; margin: 6px auto 0;
      padding: 0 16px;
    }
    .tutorial-box {
      background: var(--navy); color: white;
      padding: 12px 16px; border-radius: 14px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(10,22,40,0.2);
      border-bottom: 3px solid var(--gold);
    }
    .tutorial-box h2 {
      margin: 0 0 4px; font-size: 0.75rem;
      color: var(--gold); text-transform: uppercase;
      letter-spacing: 1.5px; font-family: 'Orbitron', sans-serif;
    }
    .tutorial-box p { margin: 0 0 10px; font-size: 0.9rem; color: #c8d8f0; font-weight: 600; }

    .tutorial-highlight {
      outline: 4px solid var(--gold) !important;
      outline-offset: 5px;
      border-radius: 12px;
      z-index: 1600 !important;
      animation: pulse-gold 1.2s infinite;
    }
    @keyframes pulse-gold {
      0%, 100% { outline-color: var(--gold); outline-width: 4px; }
      50% { outline-color: #ffe066; outline-width: 7px; }
    }

    /* ── PLAY AREA ── */
    #play-area {
      position: relative; width: 420px; height: 420px;
      border-radius: 50%;
      border: 6px solid var(--ring);
      box-shadow: 0 0 0 2px #c0d4f0, 0 12px 40px rgba(10,22,40,0.12);
      margin: 10px auto;
      background: #fff;
      overflow: hidden; z-index: 500;
    }

    /* ── OVERLAYS ── */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: #fff; z-index: 2000;
      padding: 30px 28px; text-align: center;
      border-radius: 50%;
    }

    .overlay h2 {
      margin: 0 0 14px; font-size: 1.25rem;
      color: var(--navy); font-weight: 900;
    }

    .hidden { display: none !important; }

    /* ── BUTTONS ── */
    .btn-primary {
      background: var(--gold); color: var(--navy);
      border: none; padding: 11px 20px;
      border-radius: 12px; font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--gold-dark);
      margin: 5px 0; width: 78%;
      font-size: 0.88rem;
      font-family: 'Nunito', sans-serif;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 0.3px;
    }
    .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-dark); }
    .btn-primary:hover { background: #ffd330; }

    .btn-secondary {
      background: transparent; color: var(--muted);
      border: 1.5px solid #dce8f8; padding: 8px 16px;
      border-radius: 10px; font-weight: 700;
      cursor: pointer; margin-top: 6px; width: 60%;
      font-size: 0.78rem; font-family: 'Nunito', sans-serif;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: #b0c8e8; color: var(--navy); }

    input {
      padding: 10px 14px; border: 2px solid #dce8f8;
      border-radius: 10px; margin-bottom: 8px; width: 78%;
      text-align: center; font-size: 0.88rem;
      font-family: 'Nunito', sans-serif; font-weight: 600;
      color: var(--navy); outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--navy); }

    .auth-msg {
      font-size: 0.78rem; font-weight: 700; margin: 4px 0 0;
      min-height: 18px; letter-spacing: 0.2px;
    }
    .auth-msg.error { color: var(--red); }
    .auth-msg.info  { color: var(--muted); }

    /* ── GAME ELEMENTS ── */
    #center-target {
      font-size: 80px; line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
      transition: transform 0.3s;
    }

    .sign {
      position: absolute; width: 64px; height: 64px;
      margin-left: -32px; margin-top: -32px;
      font-size: 44px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
      user-select: none;
    }
    .clickable { cursor: pointer; pointer-events: auto; }
    .clickable:hover { transform: scale(1.15) !important; }
    .sign.clickable::after {
      content: '';
      position: absolute; inset: 2px;
      border-radius: 50%;
      background: rgba(10,22,40,0.04);
      transition: background 0.2s;
    }
    .sign.clickable:hover::after { background: rgba(10,22,40,0.09); }

    /* ── TAXI UNLOCK TOAST ── */
    #taxi-unlock-toast {
      position: absolute; inset: 0; z-index: 3000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10,22,40,0.82);
      border-radius: 50%;
      animation: toast-in 0.3s ease-out;
    }
    #taxi-unlock-toast .toast-emoji {
      font-size: 3.2rem; line-height: 1;
      animation: taxi-pop 0.5s 0.1s ease-out both;
    }
    #taxi-unlock-toast .toast-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem; color: var(--gold);
      letter-spacing: 2px; text-transform: uppercase;
      margin: 10px 0 4px; font-weight: 900;
    }
    #taxi-unlock-toast .toast-body {
      font-size: 0.88rem; color: #c8d8f0;
      font-weight: 700; margin: 0;
    }
    @keyframes toast-in {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes taxi-pop {
      0%   { transform: scale(0.4) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(5deg);  opacity: 1; }
      100% { transform: scale(1)   rotate(0deg); }
    }

    /* ── VEHICLE CHOICES ── */
    .choice-container {
      display: flex; gap: 14px;
      justify-content: center; margin-top: 10px;
    }
    .choice {
      font-size: 2.8rem; cursor: pointer;
      padding: 8px 10px; border-radius: 14px;
      background: var(--bg);
      border: 2.5px solid transparent;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      line-height: 1;
    }
    .choice:hover {
      transform: scale(1.18);
      background: #e8f0ff;
      border-color: var(--soft-blue);
    }

    /* ── SELECTION OVERLAY LABEL ── */
    #selection-overlay::before {
      content: "Which vehicle did you see?";
      position: absolute;
      top: 28%;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    /* ── FAILURE OVERLAY ── */
    #failure-overlay h2 { color: var(--red) !important; font-size: 1.4rem !important; }
    #failure-overlay p { color: var(--muted); font-size: 0.82rem; margin: 0 0 14px; font-weight: 700; }

    /* ── ENTRY / READY ── */
    #entry-overlay h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem; color: var(--navy);
      margin-bottom: 6px; letter-spacing: 1px;
    }
    #entry-overlay p {
      font-size: 0.78rem; color: var(--muted);
      margin: 0 0 18px; font-weight: 700;
    }

    #start-overlay h2 { font-size: 1.5rem !important; }

    /* ── SAVE TAG ── */
    #save-tag {
      position: fixed; bottom: 6px; right: 8px;
      font-size: 9px; color: #c0c8d8;
      font-family: monospace; letter-spacing: 1px;
    }

    /* ── ANIMATIONS ── */
    @keyframes pop-in {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .overlay:not(.hidden) { animation: pop-in 0.22s ease-out; }

    @keyframes sign-appear {
      from { transform: scale(0.5) translate(-50%, -50%) !important; opacity: 0; }
      to { transform: scale(1) translate(0, 0) !important; opacity: 1; }
    }
  </style>
</head>
<body>

<div id="save-tag">SAVE 2.1.0</div>

<!-- UTILITY BAR -->
<div class="utility-bar">
  <span class="app-logo">Brain Training</span>
  <button id="logout-btn" class="hidden" onclick="handleLogout()">Log Out</button>
</div>

<!-- PROFILE STRIP -->
<div class="user-profile">
  <div class="profile-icon">
    <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
    </svg>
  </div>
  <div class="user-meta">
    <span id="user-name">Guest Player</span>
    <span id="level-badge">Level 1</span>
  </div>
  <div class="xp-pips" id="xp-pips">
    <div class="pip" id="pip-0"></div>
    <div class="pip" id="pip-1"></div>
    <div class="pip" id="pip-2"></div>
    <div class="pip" id="pip-3"></div>
    <div class="pip" id="pip-4"></div>
  </div>
</div>

<!-- TUTORIAL BANNER -->
<div id="tutorial-banner" class="hidden">
  <div class="tutorial-box">
    <h2 id="tutorial-title">Step 1</h2>
    <p id="tutorial-text"></p>
    <button class="btn-primary" id="tutorial-next-btn"
      style="width: auto; padding: 7px 22px; font-size:0.82rem; margin: 0;">
      Continue →
    </button>
  </div>
</div>

<!-- PLAY AREA -->
<div id="play-area">
  <div id="peripheral-grid"></div>

  <!-- ENTRY -->
  <div id="entry-overlay" class="overlay">
    <h1>Brain Training Pro</h1>
    <p>Sharpen memory & reaction speed</p>
    <button onclick="showOverlay('login-overlay')" class="btn-primary">Log In</button>
    <button onclick="showOverlay('signup-overlay')" class="btn-primary"
      style="background:#f0f4fb; color:var(--navy); box-shadow:0 4px 0 #c8d8f0;">
      Sign Up
    </button>
  </div>

  <!-- LOGIN -->
  <div id="login-overlay" class="overlay hidden">
    <h2>Welcome Back 👋</h2>
    <input type="text" id="login-user" placeholder="Username" autocomplete="off">
    <input type="password" id="login-pass" placeholder="Password" autocomplete="off">
    <input type="submit" class="btn-primary" onclick="handleAuth('login')" value="Play Now →">
    <div id="login-msg" class="auth-msg"></div>
    <button class="btn-secondary" onclick="showForgotPassword()">Forgot Password?</button>
    <button class="btn-secondary" onclick="showOverlay('entry-overlay')">← Back</button>
  </div>

  <!-- SIGNUP -->
  <div id="signup-overlay" class="overlay hidden">
    <h2>Create Account</h2>
    <input type="text" id="signup-user" placeholder="Choose a username" autocomplete="off">
    <input type="password" id="signup-pass" placeholder="Choose a password" autocomplete="off">
    <input type="text" id="signup-hint" placeholder="Password hint (e.g. my dog's name)" autocomplete="off">
    <div id="signup-msg" class="auth-msg"></div>
    <button class="btn-primary" onclick="handleAuth('signup')">Create & Play →</button>
    <button class="btn-secondary" onclick="showOverlay('entry-overlay')">← Back</button>
  </div>

  <!-- FORGOT PASSWORD -->
  <div id="forgot-overlay" class="overlay hidden">
    <h2>Forgot Password? 🔑</h2>
    <input type="text" id="forgot-user" placeholder="Enter your username" autocomplete="off">
    <button class="btn-primary" onclick="lookupHint()">Show My Hint</button>
    <div id="hint-result" style="margin:10px 0; padding:10px 14px; background:#f0f4fb; border-radius:10px; font-size:0.85rem; font-weight:700; color:var(--navy); width:78%; display:none; text-align:center;"></div>
    <div id="forgot-msg" class="auth-msg"></div>
    <button class="btn-secondary" onclick="showOverlay('login-overlay')">← Back to Login</button>
  </div>

  <!-- READY -->
  <div id="start-overlay" class="overlay hidden">
    <h2>Ready? 🧠</h2>
    <button class="btn-primary" onclick="startRound()">Start Training</button>
  </div>

  <!-- FAILURE -->
  <div id="failure-overlay" class="overlay hidden">
    <h2>Not Quite!</h2>
    <p>Keep going — you've got this</p>
    <button class="btn-primary" onclick="startRound()">Try Again</button>
  </div>

  <!-- VEHICLE SELECTION -->
  <div id="selection-overlay" class="overlay hidden">
    <div class="choice-container">
      <div id="choice-car"   class="choice" onclick="selectVehicle('car')">🚗</div>
      <div id="choice-truck" class="choice" onclick="selectVehicle('truck')">🚚</div>
      <div id="choice-taxi"  class="choice hidden" onclick="selectVehicle('taxi')">🚕</div>
    </div>
  </div>

  <!-- CENTER ANCHOR -->
  <div id="center-anchor" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none;">
    <div id="center-target" class="hidden"></div>
  </div>
</div>

<script>
// ── FIREBASE INIT ─────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCiJPn8GnutfKFQotR7Mu3upFHEjw_giP0",
  authDomain: "brain-training-pro.firebaseapp.com",
  databaseURL: "https://brain-training-pro-default-rtdb.firebaseio.com",
  projectId: "brain-training-pro",
  storageBucket: "brain-training-pro.firebasestorage.app",
  messagingSenderId: "776278558893",
  appId: "1:776278558893:web:8cd297640463c499075e24",
  measurementId: "G-D2T12GR1M0"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// ── HASH PASSWORD (SHA-256) ───────────────────────────────────────────────
async function hashPassword(password) {
  var msgBuffer = new TextEncoder().encode(password);
  var hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  var hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

// ── STATE ─────────────────────────────────────────────────────────────────
const EMOJIS = { car: '🚗', truck: '🚚', taxi: '🚕' };
const XP_MAX = 5;

var userData  = { name: 'Guest Player', level: 1, xp: 0 };
var gameState = { targetVehicle: 'car', currentStep: 'none', tutorialActive: false };
var taxiUnlocked = false;
var currentUsername = '';

// ── SAVE PROGRESS TO FIREBASE ─────────────────────────────────────────────
function saveProgress() {
  if (!currentUsername) return;
  db.ref('users/' + currentUsername).update({
    level: userData.level,
    xp: userData.xp,
    taxiUnlocked: taxiUnlocked
  });
}

// ── XP UI ─────────────────────────────────────────────────────────────────
function updateXPUI() {
  for (var i = 0; i < XP_MAX; i++) {
    document.getElementById('pip-' + i).classList.toggle('filled', i < userData.xp);
  }
  document.getElementById('level-badge').innerText = 'Level ' + userData.level;
}

// ── OVERLAYS ──────────────────────────────────────────────────────────────
function showOverlay(id) {
  document.querySelectorAll('.overlay').forEach(function(ov) { ov.classList.add('hidden'); });
  if (id !== 'none') document.getElementById(id).classList.remove('hidden');
}

function setMsg(id, text, type) {
  var el = document.getElementById(id);
  el.innerText = text;
  el.className = 'auth-msg ' + (type || '');
}

// ── FORGOT PASSWORD ───────────────────────────────────────────────────────
function showForgotPassword() {
  document.getElementById('forgot-user').value = '';
  document.getElementById('hint-result').style.display = 'none';
  document.getElementById('hint-result').innerText = '';
  document.getElementById('forgot-msg').innerText = '';
  showOverlay('forgot-overlay');
}

function lookupHint() {
  var username = document.getElementById('forgot-user').value.trim();
  var msgEl    = document.getElementById('forgot-msg');
  var hintEl   = document.getElementById('hint-result');

  if (!username) { setMsg('forgot-msg', 'Please enter your username.', 'error'); return; }

  setMsg('forgot-msg', 'Looking up…', 'info');
  hintEl.style.display = 'none';

  db.ref('users/' + username).once('value').then(function(snapshot) {
    if (!snapshot.exists()) {
      setMsg('forgot-msg', 'Username not found.', 'error');
      return;
    }
    var hint = snapshot.val().hint || 'No hint was set for this account.';
    msgEl.innerText = '';
    hintEl.innerText = '💡 Your hint: ' + hint;
    hintEl.style.display = 'block';
  });
}

// ── AUTH ──────────────────────────────────────────────────────────────────
function handleAuth(type) {
  var isLogin   = type === 'login';
  var usernameEl = document.getElementById(isLogin ? 'login-user' : 'signup-user');
  var passwordEl = document.getElementById(isLogin ? 'login-pass' : 'signup-pass');
  var msgId      = isLogin ? 'login-msg' : 'signup-msg';

  var username = usernameEl.value.trim();
  var password = passwordEl.value;

  if (!username) { setMsg(msgId, 'Please enter a username.', 'error'); return; }
  if (!password) { setMsg(msgId, 'Please enter a password.', 'error'); return; }

  setMsg(msgId, isLogin ? 'Logging in…' : 'Creating account…', 'info');

  hashPassword(password).then(function(hashedPw) {
    var userRef = db.ref('users/' + username);

    if (isLogin) {
      // LOGIN: check username exists and password matches
      userRef.once('value').then(function(snapshot) {
        if (!snapshot.exists()) {
          setMsg(msgId, 'Account not found.', 'error');
          return;
        }
        var data = snapshot.val();
        if (data.password !== hashedPw) {
          setMsg(msgId, 'Incorrect password.', 'error');
          return;
        }
        // Success — restore saved progress
        userData.name  = username;
        userData.level = data.level || 1;
        userData.xp    = data.xp    || 0;
        taxiUnlocked   = data.taxiUnlocked || false;
        currentUsername = username;
        onAuthSuccess();
      });

    } else {
      // SIGNUP: check username not already taken
      var hint = document.getElementById('signup-hint').value.trim();
      userRef.once('value').then(function(snapshot) {
        if (snapshot.exists()) {
          setMsg(msgId, 'Username already taken.', 'error');
          return;
        }
        // Create new account
        userRef.set({
          password: hashedPw,
          hint: hint || 'No hint set',
          level: 1,
          xp: 0,
          taxiUnlocked: false
        }).then(function() {
          userData.name  = username;
          userData.level = 1;
          userData.xp    = 0;
          taxiUnlocked   = false;
          currentUsername = username;
          onAuthSuccess();
        });
      });
    }
  });
}

function onAuthSuccess() {
  document.getElementById('user-name').innerText = userData.name;
  document.getElementById('logout-btn').classList.remove('hidden');
  // Restore taxi if already unlocked
  if (taxiUnlocked) {
    document.getElementById('choice-taxi').classList.remove('hidden');
  }
  updateXPUI();
  showOverlay('start-overlay');
}

function handleLogout() {
  saveProgress();
  currentUsername = '';
  userData  = { name: 'Guest Player', level: 1, xp: 0 };
  gameState = { targetVehicle: 'car', currentStep: 'none', tutorialActive: false };
  taxiUnlocked = false;
  document.getElementById('choice-taxi').classList.add('hidden');
  document.getElementById('user-name').innerText = 'Guest Player';
  document.getElementById('logout-btn').classList.add('hidden');
  document.getElementById('tutorial-banner').classList.add('hidden');
  document.getElementById('peripheral-grid').innerHTML = '';
  document.getElementById('center-target').classList.add('hidden');
  document.getElementById('login-user').value  = '';
  document.getElementById('login-pass').value  = '';
  document.getElementById('signup-user').value = '';
  document.getElementById('signup-pass').value = '';
  document.getElementById('signup-hint').value = '';
  document.getElementById('login-msg').innerText   = '';
  document.getElementById('signup-msg').innerText  = '';
  updateXPUI();
  showOverlay('entry-overlay');
}

// ── DIFFICULTY ────────────────────────────────────────────────────────────
function getFlashTime() {
  var t = 2000;
  if (userData.level > 10) {
    var steps = Math.floor((userData.level - 10) / 3);
    for (var i = 0; i < steps; i++) t *= 0.95;
  }
  return t;
}

// ── START ROUND ───────────────────────────────────────────────────────────
function startRound() {
  showOverlay('none');
  document.getElementById('peripheral-grid').innerHTML = '';
  document.getElementById('center-target').classList.add('hidden');
  playRound();
}

// ── PLAY ROUND ────────────────────────────────────────────────────────────
function playRound() {
  gameState.currentStep = 'flash';

  if (userData.level === 1 && userData.xp === 0 && !gameState.tutorialActive) {
    gameState.tutorialActive = true;
  }

  var pool = taxiUnlocked ? ['car', 'truck', 'taxi'] : ['car', 'truck'];
  gameState.targetVehicle = pool[Math.floor(Math.random() * pool.length)];

  var center = document.getElementById('center-target');
  center.innerHTML = EMOJIS[gameState.targetVehicle];
  center.classList.remove('hidden');

  var grid = document.getElementById('peripheral-grid');
  var correctIdx = Math.floor(Math.random() * 8);
  for (var i = 0; i < 8; i++) {
    var angle = i * 45 * Math.PI / 180;
    var el = document.createElement('div');
    el.className = 'sign';
    el.style.left = (50 + 38 * Math.cos(angle)) + '%';
    el.style.top  = (50 + 38 * Math.sin(angle)) + '%';
    if (i === correctIdx) { el.innerText = '🛑'; el.id = 'target-sign'; }
    else { el.innerText = '⭕'; }
    grid.appendChild(el);
  }

  if (gameState.tutorialActive) {
    center.classList.add('tutorial-highlight');
    document.getElementById('target-sign').classList.add('tutorial-highlight');
    updateTutorial('Step 1 of 3', 'Memorize the vehicle and where the 🛑 stop sign is.', true, function() {
      center.classList.remove('tutorial-highlight');
      document.getElementById('target-sign').classList.remove('tutorial-highlight');
      goToVehicleSelect();
    });
  } else {
    setTimeout(goToVehicleSelect, getFlashTime());
  }
}

// ── TUTORIAL ──────────────────────────────────────────────────────────────
function updateTutorial(title, text, showBtn, callback) {
  document.getElementById('tutorial-title').innerText = title;
  document.getElementById('tutorial-text').innerText  = text;
  var btn = document.getElementById('tutorial-next-btn');
  btn.style.display = showBtn ? 'inline-block' : 'none';
  btn.onclick = callback || null;
  document.getElementById('tutorial-banner').classList.remove('hidden');
}

// ── VEHICLE SELECT ────────────────────────────────────────────────────────
function goToVehicleSelect() {
  document.getElementById('center-target').classList.add('hidden');
  document.querySelectorAll('.sign').forEach(function(d) { d.style.visibility = 'hidden'; });
  gameState.currentStep = 'vehicle';
  showOverlay('selection-overlay');

  if (gameState.tutorialActive) {
    var el = document.getElementById('choice-' + gameState.targetVehicle);
    if (el) el.classList.add('tutorial-highlight');
    updateTutorial('Step 2 of 3', 'Tap the vehicle you just saw.', false, null);
  }
}

function selectVehicle(choice) {
  if (choice === gameState.targetVehicle) {
    document.querySelectorAll('.choice').forEach(function(c) { c.classList.remove('tutorial-highlight'); });
    gameState.currentStep = 'sign';
    showOverlay('none');
    document.querySelectorAll('.sign').forEach(function(d) {
      d.style.visibility = 'visible';
      d.innerText = '❓';
      d.classList.add('clickable');
    });
    if (gameState.tutorialActive) {
      document.getElementById('target-sign').classList.add('tutorial-highlight');
      updateTutorial('Step 3 of 3', 'Tap the ❓ where you saw the stop sign.', false, null);
    }
  } else {
    handleLoss();
  }
}

// ── SIGN CLICK ────────────────────────────────────────────────────────────
document.getElementById('peripheral-grid').addEventListener('click', function(e) {
  if (gameState.currentStep !== 'sign') return;
  var sign = e.target.closest('.sign');
  if (!sign) return;

  if (sign.id === 'target-sign') {
    if (gameState.tutorialActive) {
      confetti({ particleCount: 80, spread: 60, origin: { y: 0.65 } });
      gameState.tutorialActive = false;
      document.getElementById('tutorial-banner').classList.add('hidden');
      sign.classList.remove('tutorial-highlight');
    }

    userData.xp += 1;

    if (userData.xp >= XP_MAX) {
      userData.xp = 0;
      userData.level++;
      fireLevelUpConfetti();

      if (!taxiUnlocked && userData.level >= 3) {
        taxiUnlocked = true;
        document.getElementById('choice-taxi').classList.remove('hidden');
        saveProgress();
        updateXPUI();
        var toast = document.createElement('div');
        toast.id = 'taxi-unlock-toast';
        toast.innerHTML = '<div class="toast-emoji">🚕</div><p class="toast-title">New Vehicle Unlocked!</p><p class="toast-body">The Taxi joins the lineup</p>';
        document.getElementById('play-area').appendChild(toast);
        setTimeout(function() { toast.remove(); startRound(); }, 2400);
        return;
      }
    }

    saveProgress();
    updateXPUI();
    startRound();
  } else {
    handleLoss();
  }
});

// ── CONFETTI ──────────────────────────────────────────────────────────────
function fireLevelUpConfetti() {
  var count = 200;
  var base = { origin: { y: 0.7 } };
  function fire(r, o) { confetti(Object.assign({}, base, o, { particleCount: Math.floor(count * r) })); }
  fire(0.25, { spread: 26, startVelocity: 55 });
  fire(0.2,  { spread: 60 });
  fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
  fire(0.1,  { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
  fire(0.1,  { spread: 120, startVelocity: 45 });
}

// ── LOSS ──────────────────────────────────────────────────────────────────
function handleLoss() {
  userData.xp = Math.max(0, userData.xp - 1);
  saveProgress();
  updateXPUI();
  showOverlay('failure-overlay');
}
</script>
</body>
